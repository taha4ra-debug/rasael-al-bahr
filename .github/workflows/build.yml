name: Build Direct Signed APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Create Dummy WWW Directory
        run: mkdir -p www && echo "<html></html>" > www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Assets and Sync
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK (Direct Install)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Direct APK
        uses: actions/upload-artifact@v4
        with:
          name: rasael-al-bahr-direct
          path: android/app/build/outputs/apk/debug/app-debug.apk
