name: Build Signed Release (APK & AAB)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Create Dummy WWW Directory
        run: mkdir -p www && echo "<html></html>" > www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Assets and Sync
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Unsigned Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign Release APK
        run: |
          ${JAVA_HOME}/bin/jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore bayannet.keystore \
            -storepass "63845800aA++" \
            -keypass "63845800aA++" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk bayannet-key

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rasael-al-bahr-signed-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB (For Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: rasael-al-bahr-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
