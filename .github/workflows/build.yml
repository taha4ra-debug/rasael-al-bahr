name: Generate Keystore & Build Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate KeyStore
        run: |
          keytool -genkeypair -v \
            -keystore bayannet.keystore \
            -alias bayannet-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "63845800aA++" \
            -keypass "63845800aA++" \
            -dname "CN=BayanNet, OU=IT, O=Bayan, L=Gaza, C=PS"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayannet-keystore
          path: bayannet.keystore
